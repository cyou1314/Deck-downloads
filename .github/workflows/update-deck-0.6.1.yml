name: Finalize verified Deck 0.6.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-deck-0.6.1.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/cyou1314/Deck-downloads/releases/403729098'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def api(method, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=headers, method=method)
              return json.load(urllib.request.urlopen(req))
          release = api('GET')
          expected = {"Deck-Setup-0.6.1.exe":"sha256:55c5c9fdb899f1448cdc305cb61d9cb6e186febe65eb77ddd173b07d962a948a","Deck-Setup-0.6.1.exe.blockmap":"sha256:c5f87be4d92f9dd0368f4a216db88ad0bee9099086b8600dd3c6d03ee15f610a","latest.yml":"sha256:762921dbfda87e304b69f4ff78f9c6425581ed7bd518551803e45a8f04aeb68b"}
          assert release['tag_name'] == 'v0.6.1'
          assert {a['name']: a['digest'] for a in release['assets']} == expected
          result = api('PATCH', {'draft': False, 'prerelease': True, 'make_latest': 'false', 'body': "Deck 0.6.1 · 2026-10-05\n\n新增顶部对齐、横向等距排列、方向键微调（Shift 加速），修复连线后目标节点配置选择，优化菜单边界、窄窗口工具条、键盘焦点和删除按钮显示。保留节点内图片/视频生成设置及 Dola 账号选择。\n\n253 项测试、安全检查、浏览器交互及 Windows 安装启动检查通过。本轮未执行真实 Dola 付费生成，保留测试版标记。\n\n请下载 0.6.1 覆盖安装并保留原 Deck 数据目录。0.6.0 历史版本继续保留。"})
          assert result['draft'] == False
          print('Deck 0.6.1 published with verified assets')
          PY
