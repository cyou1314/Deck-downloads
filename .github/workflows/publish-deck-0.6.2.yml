name: Upload verified Deck 0.6.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-deck-0.6.2.yml']
permissions:
  contents: write
concurrency:
  group: publish-deck-0.6.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, urllib.error, zipfile
          source = "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-6954-81fa-802d-d87b180f2a23/raw?se=2026-10-05T15%3A09%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=1bf2ecae-1978-4d4d-a690-71e8c38f34de&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T03%3A55%3A00Z&ske=2026-10-06T03%3A55%3A00Z&sks=b&skv=2026-02-06&sig=5zzU8WPBC9ZLMbSSaK82HXuj1qpogr5HljHUAXx%2B%2Boo%3D"
          expected_zip = 'bf8c3deb24dcbada95290a1ef30a2cdb502862dcd09848a02f5abb8d2871ade8'
          data = urllib.request.urlopen(source, timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == expected_zip
          archive = zipfile.ZipFile(io.BytesIO(data))
          names = ['Deck-Setup-0.6.2.exe', 'Deck-Setup-0.6.2.exe.blockmap', 'latest.yml']
          assert set(archive.namelist()) == {'release-0.6.2/' + n for n in names}
          files = {n: archive.read('release-0.6.2/' + n) for n in names}
          installer = files[names[0]]
          yaml = files['latest.yml'].decode()
          assert installer[:2] == b'MZ'
          assert 'version: 0.6.2' in yaml and str(len(installer)) in yaml
          assert base64.b64encode(hashlib.sha512(installer).digest()).decode() in yaml
          root = 'https://api.github.com/repos/cyou1314/Deck-downloads'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def api(method, url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, headers=headers, method=method)
              return json.load(urllib.request.urlopen(req, timeout=120))
          try:
              release = api('GET', root + '/releases/tags/v0.6.2')
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api('POST', root + '/releases', {'tag_name': 'v0.6.2', 'target_commitish': os.environ['GITHUB_SHA'], 'name': 'Deck 0.6.2', 'body': "Deck 0.6.2 · 2026-10-05\n\n- 连线可单独选中、删除及撤销；支持 Delete / Backspace，空格拖动平移。\n- 从素材端口拖到空白处，可选择生成图片或视频并自动连接素材。\n- 图片和视频使用更大预览；生成、文字、音频节点保持紧凑。\n- 参数编辑使用独立侧边面板；窄窗口切换到底部。生成结果作为独立媒体节点，可定位最新版本。\n- 新节点和结果自动避让，新增按输入 → 生成 → 结果整理布局，改善缩放适配、编辑焦点与时间线切换。\n\n260 项单元测试、Chromium 画布交互、安全检查及 Windows 静默安装启动检查通过。安装包与更新文件已校验。本轮未执行真实 Dola 付费生成，保留测试版标记。\n\n请下载 0.6.2 覆盖安装，保留原 Deck 数据目录。0.6.0 / 0.6.1 历史版本继续保留。", 'draft': True, 'prerelease': True, 'make_latest': 'false'})
          assert release['tag_name'] == 'v0.6.2' and release['draft']
          existing = {a['name']: a for a in release['assets']}
          for name, payload in files.items():
              expected = 'sha256:' + hashlib.sha256(payload).hexdigest()
              if name in existing:
                  assert existing[name]['digest'] == expected and existing[name]['size'] == len(payload)
                  continue
              upload = release['upload_url'].split('{')[0] + '?name=' + name
              req = urllib.request.Request(upload, data=payload, headers={**headers, 'Content-Type': 'application/octet-stream'}, method='POST')
              asset = json.load(urllib.request.urlopen(req, timeout=300))
              assert asset['digest'] == expected and asset['size'] == len(payload)
          release = api('GET', root + '/releases/' + str(release['id']))
          assert {a['name']: a['digest'] for a in release['assets']} == {n: 'sha256:' + hashlib.sha256(p).hexdigest() for n, p in files.items()}
          release = api('PATCH', root + '/releases/' + str(release['id']), {'draft': False, 'prerelease': True, 'make_latest': 'false'})
          assert not release['draft'] and release['prerelease']
          print('Published Deck 0.6.2 with all three verified assets:', release['html_url'])
          PY
# Verified artifact transfer for 0.6.2.
