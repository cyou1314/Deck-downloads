name: Finalize validated Deck 0.6.0 update
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/update-deck-0.6.0.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify replacement assets and clean superseded files
        uses: actions/github-script@v7
        with:
          script: |
            const owner='cyou1314',repo='Deck-downloads',tag='v0.6.0';
            if(context.repo.owner!==owner||context.repo.repo!==repo)throw new Error('Unexpected repository');
            const release=(await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            if(release.id!==399854688||release.immutable)throw new Error('Unexpected release');
            const expected=[
              {name:'Deck-Setup-0.6.0.exe',size:111744055,digest:'sha256:873a10a38e5fc1a6ddd9c89f1c111eedd39aa06dfe79be4608c0e10e086b58d8'},
              {name:'Deck-Setup-0.6.0.exe.blockmap',size:118834,digest:'sha256:1f203ccc3673bd2dfd865630094c95633dee0d0c7d275a1268478cc7d803e712'},
              {name:'latest.yml',size:337,digest:'sha256:73606b5c48fce248c22419f63e36b099dbd705ab28bc63407bfd1b72736fdf38'}
            ];
            const assets=(await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id,per_page:100})).data;
            for(const wanted of expected){
              const asset=assets.find(item=>item.name===wanted.name);
              if(!asset||asset.size!==wanted.size||asset.digest!==wanted.digest)throw new Error('Replacement asset mismatch: '+wanted.name);
            }
            const body='2026-10-03 更新：完善无限画布、Dola 账号生成与项目恢复。\n\n- 简洁浅色界面、统一图标、自由拖动与连线。\n- 明确选择 Dola 账号、模型、画幅与时长；预检和准备后核对提交，结果自动保存并回到画布。\n- 每次生成保留独立版本；多项目、自动备份、导入与恢复副本。\n- 支持 PNG 和含音轨的 WebM 导出。\n\n244 项测试、生产依赖审计、Windows 静默安装与启动检查通过。Dola 调用使用现有适配器；本轮未用真实账号扣额度生成视频。\n\n保留当前测试发布标记。已有旧 0.6.0 的用户请重新下载并覆盖安装，保留原 Deck 数据目录；0.5.x 用户也可手动安装此版本。';
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,name:release.name,body,make_latest:release.prerelease||release.draft?'false':'true'});
            const oldIds=[600621891,600622081,600622106];
            for(const id of oldIds){
              const old=assets.find(item=>item.id===id);
              if(!old)continue;
              if(!old.name.startsWith('superseded-'+id+'-'))throw new Error('Unexpected superseded asset');
              await github.rest.repos.deleteReleaseAsset({owner,repo,asset_id:id});
            }
            core.notice('Verified new binaries and removed obsolete 0.6.0 assets.');
