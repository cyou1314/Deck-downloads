name: Publish verified Deck 0.6.5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-deck-0.6.5.yml']
permissions:
  contents: write
concurrency:
  group: publish-deck-0.6.5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, subprocess, pathlib, urllib.request, urllib.error, zipfile
          source = "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-4500-8206-8534-e19bcd710266/raw?se=2026-10-06T17%3A49%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=a313bb19-9cff-4f30-8e18-50d530546298&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A01%3A58Z&ske=2026-10-07T02%3A01%3A58Z&sks=b&skv=2026-02-06&sig=p58sMeVEA1oFID/WzKOYmu/aME9CDR1PjCcOt6T45xg%3D"
          expected_zip = 'fcf757df2e144b3f1712755eec1f06df5a8f467a1fe04ddae5c63aaee8092343'
          subprocess.run(['curl', '--fail', '--location', '--retry', '2', '--silent', '--show-error', source, '-o', 'source.zip'], check=True)
          data = pathlib.Path('source.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected_zip
          archive = zipfile.ZipFile(io.BytesIO(data))
          names = ['Deck-Setup-0.6.5.exe', 'Deck-Setup-0.6.5.exe.blockmap', 'latest.yml']
          assert set(archive.namelist()) == {'release-0.6.5/' + n for n in names}
          files = {n: archive.read('release-0.6.5/' + n) for n in names}
          expected_assets = {"Deck-Setup-0.6.5.exe":[111769123,"7d15f904511a71c663cb34322a3040fa23d6f004afe1c5fce20b9f16b496837e"],"latest.yml":[337,"e3867433c5ef3a91c4dd3c4f11830a7714d4ef875595deb6d65971496b958eaf"],"Deck-Setup-0.6.5.exe.blockmap":[118903,"788fab6dc123eb57ed3d4de13cf44e79f5a95283b10caaee24b4b1da21e8a36f"]}
          for name, payload in files.items():
              size, digest = expected_assets[name]
              assert len(payload) == size and hashlib.sha256(payload).hexdigest() == digest
          installer = files[names[0]]
          yaml = files['latest.yml'].decode()
          assert installer[:2] == b'MZ'
          assert 'version: 0.6.5' in yaml and str(len(installer)) in yaml
          assert base64.b64encode(hashlib.sha512(installer).digest()).decode() in yaml
          root = 'https://api.github.com/repos/cyou1314/Deck-downloads'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def api(method, url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, headers=headers, method=method)
              return json.load(urllib.request.urlopen(req, timeout=120))
          try:
              release = api('GET', root + '/releases/tags/v0.6.5')
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api('POST', root + '/releases', {'tag_name': 'v0.6.5', 'target_commitish': os.environ['GITHUB_SHA'], 'name': 'Deck 0.6.5', 'body': "Deck 0.6.5 · 2026-10-07\n\n- 修复连接工具在两次点击之间移动鼠标会退出连接的问题；支持拖到节点本体，触屏、触笔和捕获指针按实际落点判断。端口扩大并随缩放补偿，生成节点输出可连接当前已保存成品。\n- 修复视频准备对 Dola 控件与编辑器布局识别不全的问题：兼容专用和通用参数键、非按钮标签、textarea/contenteditable，以及控件延迟加载。原生下拉框按实际选中项核对模型、画幅、时长，提示词通过可见编辑器写入。\n- 防止旧同步响应把已完成或已保存任务改回生成中。缓存账号立即读取，已有轮询可手动刷新；运行中的画布任务定期恢复同步，避免漏掉通知。\n- 保留原会话地址、结果基线和观察上下文，历史任务超出最近列表后仍可恢复下载；共享账号的旧任务按顺序读取，避免会话互相切换。\n- 准备阶段显示具体进度，便于定位页面、参数、参考上传或提示词环节的失败。\n\n296 项回归测试、Chromium 鼠标和键盘连线检查、四种隔离页面中的实际视频适配器准备/确认提交流程、依赖审计，以及 Windows 安装和启动检查通过。安装包与更新文件均已校验。\n\n浏览器测试没有使用真实 Dola 账号或付费生成；真实服务端生成与结果回填仍需实际验证。若仍失败，请提供画布节点上显示的具体报错。\n\n请下载 Deck-Setup-0.6.5.exe 覆盖安装，保留原 Deck 数据目录。", 'draft': True, 'prerelease': False, 'make_latest': 'true'})
          assert release['tag_name'] == 'v0.6.5' and release['draft']
          existing = {a['name']: a for a in release['assets']}
          for name, payload in files.items():
              expected = 'sha256:' + hashlib.sha256(payload).hexdigest()
              if name in existing:
                  assert existing[name]['digest'] == expected and existing[name]['size'] == len(payload)
                  continue
              upload = release['upload_url'].split('{')[0] + '?name=' + name
              req = urllib.request.Request(upload, data=payload, headers={**headers, 'Content-Type': 'application/octet-stream'}, method='POST')
              asset = json.load(urllib.request.urlopen(req, timeout=300))
              assert asset['digest'] == expected and asset['size'] == len(payload)
          release = api('GET', root + '/releases/' + str(release['id']))
          assert {a['name']: a['digest'] for a in release['assets']} == {n: 'sha256:' + hashlib.sha256(p).hexdigest() for n, p in files.items()}
          release = api('PATCH', root + '/releases/' + str(release['id']), {'draft': False, 'prerelease': False, 'make_latest': 'true'})
          assert not release['draft'] and not release['prerelease']
          print('Published Deck 0.6.5 with all three verified assets:', release['html_url'])
          PY
# Verified artifact transfer for 0.6.5.
