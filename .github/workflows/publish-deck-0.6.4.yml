name: Publish verified Deck 0.6.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-deck-0.6.4.yml']
permissions:
  contents: write
concurrency:
  group: publish-deck-0.6.4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, subprocess, pathlib, urllib.request, urllib.error, zipfile
          source = "https://sdmntprwestus.oaiusercontent.com/files/00000000-de10-8230-bfe6-2577f520fb33/raw?se=2026-10-06T14%3A17%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=c90c1645-5d01-4882-aad1-39485f0b02b7&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T00%3A10%3A31Z&ske=2026-10-07T00%3A10%3A31Z&sks=b&skv=2026-02-06&sig=V7bx5GBppeoZm8JT2re1AfclHWYlc3sVS3zvhULFVHI%3D"
          expected_zip = 'c78b4999a23c93b93309ad98bb2cf59b49ecb6e67719cd3704bb7dcdf087b041'
          subprocess.run(['curl', '--fail', '--location', '--retry', '2', '--silent', '--show-error', source, '-o', 'source.zip'], check=True)
          data = pathlib.Path('source.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected_zip
          archive = zipfile.ZipFile(io.BytesIO(data))
          names = ['Deck-Setup-0.6.4.exe', 'Deck-Setup-0.6.4.exe.blockmap', 'latest.yml']
          assert set(archive.namelist()) == {'release-0.6.4/' + n for n in names}
          files = {n: archive.read('release-0.6.4/' + n) for n in names}
          expected_assets = {'Deck-Setup-0.6.4.exe': (111767461, '5b716c881fb496a887d865a5f25b2e4f2b839347b56313d05395bb4162b9fcf5'), 'Deck-Setup-0.6.4.exe.blockmap': (118865, 'f3e7cf6bf0144859834b69a0b046b5151ff7d59f0b8351f2b0d10f68dff2541c'), 'latest.yml': (337, 'adc815f56bfb037d97d5f559ff0db7d73aa32f17a75da5b40159d610ad411616')}
          for name, payload in files.items():
              size, digest = expected_assets[name]
              assert len(payload) == size and hashlib.sha256(payload).hexdigest() == digest
          installer = files[names[0]]
          yaml = files['latest.yml'].decode()
          assert installer[:2] == b'MZ'
          assert 'version: 0.6.4' in yaml and str(len(installer)) in yaml
          assert base64.b64encode(hashlib.sha512(installer).digest()).decode() in yaml
          root = 'https://api.github.com/repos/cyou1314/Deck-downloads'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def api(method, url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, headers=headers, method=method)
              return json.load(urllib.request.urlopen(req, timeout=120))
          try:
              release = api('GET', root + '/releases/tags/v0.6.4')
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api('POST', root + '/releases', {'tag_name': 'v0.6.4', 'target_commitish': os.environ['GITHUB_SHA'], 'name': 'Deck 0.6.4', 'body': "Deck 0.6.4 · 2026-10-06\n\n- 图片和视频按原素材比例预览，卡片大小可调整，常用操作精简。\n- 生成设置使用独立可调面板，准备和确认提交固定在底部，适配窄窗口。\n- 多版本成品默认叠放，可切换、展开、标记满意版本和并排对比；下游参考连接保持。\n- 素材库增加缩略图、名称搜索、类型和来源筛选。\n- 新增任务总览，可定位任务、继续保存、恢复账号和复用失败参数；历史记录保留，重试仍需核对和确认。\n- 新增镜头分区，可按选区或镜头编号建立，支持命名、整组移动、折叠、定位和整理。\n- 修复图片和视频结果回填、生成状态恢复与下载重试；已有任务同步不重复提交。\n- 无关节点更新保留媒体，屏幕外视频暂停；验证视频首帧和实际 PNG 导出。\n\n290 项测试、Chromium 画布交互与媒体解码检查、依赖审计、Windows 安装及启动检查通过。安装包及更新文件已校验。测试使用模拟任务和本地媒体，真实 Dola 账号生成与服务端回填仍需实际验证。\n\n请下载 Deck-Setup-0.6.4.exe 覆盖安装，保留原 Deck 数据目录。源代码保持私有。", 'draft': True, 'prerelease': False, 'make_latest': 'true'})
          assert release['tag_name'] == 'v0.6.4' and release['draft']
          existing = {a['name']: a for a in release['assets']}
          for name, payload in files.items():
              expected = 'sha256:' + hashlib.sha256(payload).hexdigest()
              if name in existing:
                  assert existing[name]['digest'] == expected and existing[name]['size'] == len(payload)
                  continue
              upload = release['upload_url'].split('{')[0] + '?name=' + name
              req = urllib.request.Request(upload, data=payload, headers={**headers, 'Content-Type': 'application/octet-stream'}, method='POST')
              asset = json.load(urllib.request.urlopen(req, timeout=300))
              assert asset['digest'] == expected and asset['size'] == len(payload)
          release = api('GET', root + '/releases/' + str(release['id']))
          assert {a['name']: a['digest'] for a in release['assets']} == {n: 'sha256:' + hashlib.sha256(p).hexdigest() for n, p in files.items()}
          release = api('PATCH', root + '/releases/' + str(release['id']), {'draft': False, 'prerelease': False, 'make_latest': 'true'})
          assert not release['draft'] and not release['prerelease']
          print('Published Deck 0.6.4 with all three verified assets:', release['html_url'])
          PY
# Verified artifact transfer for 0.6.4.
